[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nevtx"
version = "0.1.0"
description = "A modern, lightweight Windows Event Log (.evtx) TUI viewer and triage tool for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Security Analyst", email = "analyst@example.com" }
]
keywords = ["dfir", "cybersecurity", "evtx", "windows-event-logs", "tui", "incident-response"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "textual>=0.70.0",
    "evtx>=0.8.0",
    "rich>=13.0.0",
    "xmltodict>=0.13.0",
]

[project.scripts]
nevtx = "nevtx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
